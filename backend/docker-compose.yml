# Local development only. Run from the backend/ directory: docker compose up --build
# Postgres credentials come from backend/.env (POSTGRES_*); the fallbacks below are
# throwaway local-dev values, never used in production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerchain}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerchain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LEDGERCHAIN_ENVIRONMENT: development
      # Inside the compose network the database host is `db`, not localhost.
      LEDGERCHAIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ledgerchain}:${POSTGRES_PASSWORD:-ledgerchain}@db:5432/${POSTGRES_DB:-ledgerchain}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/srv/app
      - ./migrations:/srv/migrations
      - ./alembic.ini:/srv/alembic.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
